  place-items:center;
  padding:25px;
}

.lightbox.active{

/* =========================================================
   BACK TO TOP
   ========================================================= */

.back-top{

  height:46px;

  color:#fff;
  cursor:pointer;
  box-shadow:0 12px 30px rgba(170,50,95,.28);
  opacity:0;
  visibility:hidden;
  transform:translateY(15px);
  transition:.3s;
}

.back-top.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

/* =========================================================
   SCROLL ANIMATION
   ========================================================= */

.reveal{
  opacity:0;
  transform:translateY(30px);
  transition:

}

.reveal.visible{

  transform:none;
}
